services:
  weather-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather-server
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      - weather-data:/data
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-65536}
      MAX_RANGE_LIMIT: ${MAX_RANGE_LIMIT:-5000}
      MAX_EXPORT_LIMIT: ${MAX_EXPORT_LIMIT:-50000}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-134217728}
      STATION_STALE_AFTER_SECONDS: ${STATION_STALE_AFTER_SECONDS:-10800}
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-DELETE}
      TRUST_PROXY_COUNT: ${TRUST_PROXY_COUNT:-1}
      ENABLE_DIAGNOSTIC_ROUTES: ${ENABLE_DIAGNOSTIC_ROUTES:-false}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${MEMORY_LIMIT:-512m}
    cpus: ${CPU_LIMIT:-1.0}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  weather-data:
    name: ${DATA_VOLUME_NAME:-aws_longavi_weather-data}
    driver: local
